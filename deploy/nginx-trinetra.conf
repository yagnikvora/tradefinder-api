# nginx front for Trinetra — PUBLIC, no authentication.
#
#   sudo cp deploy/nginx-trinetra.conf /etc/nginx/sites-available/trinetra
#   sudo ln -s /etc/nginx/sites-available/trinetra /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Works immediately on a bare IP over HTTP — no domain, no certificate, no password. Open
# http://<server-ip>/ and the dashboard is there. `server_name _` matches any host, so this
# answers whether you reach it by IP or by a domain you point here later.
#
# THIS IS DELIBERATELY OPEN. Anyone who has the address can read the board and the trade journal,
# and — because the dashboard proxies the journal's write routes — can also edit an entry, post an
# exit, settle the day, rewrite the scanner config, or trigger a baseline rebuild. That is the
# stated intent for this deployment. The two blocks at the bottom of this file are the mitigations
# for the two consequences that are about the app WORKING rather than about privacy; both are
# commented out and neither closes public read access.
#
# The API on 4100 is NOT proxied here and stays on loopback. That is not a restriction on the
# public: every page is rendered server-side and `web/lib/proxy.ts` makes the browser poll the web
# app's own origin, so nothing a visitor does ever needs port 4100. See the /raw/ block below if
# you want the JSON API reachable from outside as well.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Kept so `certbot --nginx -d yourdomain.com` can validate later without editing this file.
    # Certbot will then add its own 443 block and a redirect. Nothing below needs to change.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Not access control — these stop the page being framed by another site and stop MIME sniffing.
    # No visitor is turned away by them.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # The dashboard polls every 2s and a snapshot is ~1.8MB unzipped. At that rate compression is
    # not a nicety — it is the difference between a responsive page and a saturated uplink.
    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Longer than the 60s default because /momentum/journal/exit-lab grades every archived
        # option path in one request and is legitimately slow. The 2s poll is unaffected.
        proxy_read_timeout 120s;
    }

    # ---------------------------------------------------------------- optional: the raw JSON API
    # Uncomment to expose the API itself. The prefix is /raw/ and NOT /api/ on purpose: Next.js
    # serves its own routes under /api/, and a location block there would shadow them and break
    # the journal page. `/raw/health` maps to the API's `/health`.
    #
    # location /raw/ {
    #     proxy_pass http://127.0.0.1:4100/;
    #     proxy_set_header Host $host;
    #     proxy_read_timeout 120s;
    # }

    # ------------------------------------------- optional: keep the Upstox quota from being burned
    # This is about UPTIME, not privacy, which is why it is worth a look even on an open site.
    # `POST /momentum/baseline/rebuild` spends ~416 Upstox requests against a 2000-per-30-minute
    # budget. A handful of calls empties it, and an empty budget means the 08:00 baseline does not
    # build, which takes RVOL — the heaviest factor in the model — off every row for the session.
    # Bots do not guess that path, so this is a low risk, but the cost if it happens is a whole
    # trading day. Reading the board is untouched: only writes are limited.
    #
    # Put this line in /etc/nginx/nginx.conf inside the http{} block:
    #     limit_req_zone $binary_remote_addr zone=writes:10m rate=10r/m;
    #
    # then uncomment here:
    # location ~ ^/api/momentum/(journal|config|baseline|seed|scan) {
    #     limit_req zone=writes burst=5 nodelay;
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_set_header Host $host;
    #     proxy_read_timeout 120s;
    # }
}
